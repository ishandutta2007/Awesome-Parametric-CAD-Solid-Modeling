<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="420" viewBox="0 0 1200 420" style="background:linear-gradient(135deg,#070d19 0,#0c192e 50%,#112240 100%);border-radius:16px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#38bdf8" stroke-width=".75" d="M 40 0 L 0 0 0 40" opacity=".12"/><circle cx="0" cy="0" r="1.5" fill="#38bdf8" opacity=".25"/></pattern><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="50%" stop-color="#818cf8" stop-opacity=".7"/><stop offset="100%" stop-color="#c084fc" stop-opacity=".8"/></linearGradient><linearGradient id="accent-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="card-glow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#0284c7" flood-opacity=".3" stdDeviation="12"/></filter><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes orbitWireframe{0%{transform:rotate(0deg) rotateX(60deg)}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-10px)}}.cad-pulse{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.cad-float{animation:floatSlow 5s ease-in-out infinite}.dashed-path{stroke-dasharray:6,6;animation:dashAnim 20s linear infinite}</style></defs><rect width="100%" height="100%" fill="url(#cad-grid)"/><circle cx="150" cy="100" r="140" fill="#0284c7" class="cad-pulse" opacity=".18"/><circle cx="1050" cy="300" r="180" fill="#6366f1" class="cad-pulse" opacity=".15