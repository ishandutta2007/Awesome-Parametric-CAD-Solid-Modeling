<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background: linear-gradient(135deg, #070d19 0%, #0c192e 50%, #112240 100%); border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="cad-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" opacity="0.12"/>
      <circle cx="0" cy="0" r="1.5" fill="#38bdf8" opacity="0.25"/>
    </pattern>

    <!-- Linear Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes orbitWireframe {
        0% { transform: rotate(0deg) rotateX(60deg); }
        100% { transform: rotate(360deg) rotateX(60deg); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -100; }
      }
      .cad-pulse {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .cad-float {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .dashed-path {
        stroke-dasharray: 6, 6;
        animation: dashAnim 20s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#cad-grid)"/>

  <!-- Ambient Light Orbs (Background layer) -->
  <circle cx="150" cy="100" r="140" fill="#0284c7" opacity="0.18" class="cad-pulse" />
  <circle cx="1050" cy="300" r="180" fill="#6366f1" opacity="0.15" class="cad-pulse" style="animation-delay: -3s;" />

  <!-- Dynamic Parametric Engineering Graphics (Right Side / Background) -->
  <g transform="translate(930, 210)" class="cad-float">
    <!-- Isometric 3D Solid Model Wireframe -->
    <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4"/>
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="-86" y1="-50" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="86" y1="-50" x2="0" y2="0" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="0" x2="0" y2="100" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

    <!-- Concentric Parametric Constraint Rings -->
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="none" stroke="#818cf8" stroke-width="1.5" class="dashed-path" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="190" ry="110" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.25"/>

    <!-- Dimension Constraint Markers -->
    <circle cx="86" cy="-50" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="-86" cy="-50" r="4" fill="#38bdf8" opacity="0.8"/>
    <circle cx="0" cy="100" r="4" fill="#818cf8" opacity="0.8"/>
    <circle cx="0" cy="-100" r="4" fill="#c084fc" opacity="0.8"/>
  </g>

  <!-- Technical Overlay Lines -->
  <path d="M 60 70 L 260 70 L 280 90 L 650 90" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" class="dashed-path"/>
  <circle cx="60" cy="70" r="3" fill="#38bdf8"/>
  <text x="290" y="85" fill="#38bdf8" font-size="11" font-weight="600" letter-spacing="2" opacity="0.8">SYSTEM ARCHITECTURE // B-REP // CSG // CODE-AS-CAD</text>

  <!-- Foreground Content Block (High contrast, clearly visible) -->
  <g transform="translate(80, 150)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="15" cy="15" r="5" fill="#00f2fe" filter="url(#glow)"/>
      <text x="28" y="20" fill="#e0f2fe" font-size="12" font-weight="700" letter-spacing="1">CURATED DEVELOPER DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="72" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Parametric CAD
    </text>
    <text x="0" y="118" fill="url(#accent-cyan)" font-size="36" font-weight="700" letter-spacing="-0.5">
      &amp; Solid Modeling Ecosystem
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="162" fill="#94a3b8" font-size="16" font-weight="400" line-height="24">
      B-Rep Geometric Kernels · Code-as-CAD · OpenCascade · Constraint Solvers · STEP Pipelines
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 195)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="18" fill="#38bdf8" font-size="12" font-weight="600">⚡ OpenCascade</text>

      <!-- Tag 2 -->
      <rect x="122" y="0" width="105" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="136" y="18" fill="#a78bfa" font-size="12" font-weight="600">⚙️ FreeCAD</text>

      <!-- Tag 3 -->
      <rect x="239" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="253" y="18" fill="#34d399" font-size="12" font-weight="600">🐍 CadQuery</text>

      <!-- Tag 4 -->
      <rect x="366" y="0" width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="380" y="18" fill="#fb923c" font-size="12" font-weight="600">🦀 Rust B-Rep</text>
    </g>
  </g>
</svg>
